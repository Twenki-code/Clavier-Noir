
name: Build Clavier Noir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tsy nahita ZIP tao amin'ny repository."
            exit 1
          fi

          echo "ZIP hita: $ZIP_FILE"
          mkdir -p source
          unzip -o -q "$ZIP_FILE" -d source

          GRADLEW="$(find source -type f -name gradlew | head -n 1)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Tsy misy gradlew ao anatin'ny ZIP."
            echo "Ireto ny rakitra Gradle hita:"
            find source -maxdepth 5 -type f \
              \( -name 'settings.gradle' -o \
                 -name 'settings.gradle.kts' -o \
                 -name 'gradlew' \)
            exit 1
          fi

          echo "Projet hita: $(dirname "$GRADLEW")"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clavier-Noir-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
